services:
  bot:
    build: .
    env_file: .env
    environment:
      # "db" is the service name below - inside Docker that's the hostname, not localhost
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PYTHONUNBUFFERED: "1"
      MAX_MSG_CACHE : 10000
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres is actually ready
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data   # keeps data when the container is rebuilt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Uncomment to connect from your PC with a GUI tool (DBeaver, pgAdmin) on localhost:5432
    # ports:
    #   - "5432:5432"

volumes:
  pgdata: